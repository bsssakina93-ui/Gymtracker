name: Build Gym Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GymTrackerAndroid_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Extract Android project ZIP
        run: unzip GymTrackerAndroid_Source.zip -d source

      - name: Find Android project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts
          test -f source/GymTrackerAndroid/app/build.gradle || test -f source/GymTrackerAndroid/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p source/GymTrackerAndroid assembleDebug
